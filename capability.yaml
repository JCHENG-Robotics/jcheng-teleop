# Capability manifest for the organization's admission check.
# jcheng-teleop is an L3 capability: operator input to teleoperation intent
# (JCHENG-Robotics/.github docs/repo-taxonomy.md, layer L3).
#
# v0.3.0 implements the M1 ROS-free core and CLI plus the later M2-M7 offline
# surfaces (capture, replay, status API, supervised preflight). The manifest
# deliberately keeps an empty runtime: `ros2_ws/` ships a **test-only** M2
# publisher on domain 42, but it has no production lease adapter, no operator
# input device and is not a deployed capability runtime. Declaring it requires
# the `intent_source` class proposed in jcheng-interfaces
# (docs/proposals/capability-intent-source.md); until that is approved and
# tagged, `class: offline` with an empty runtime is the honest claim. The
# system layer remains the only origin of motion.
#
# The safety envelope below is declared even while `class: offline`; it is not
# active because the runtime surface is empty. It becomes binding together
# with the `intent_source` class, the node scopes and the admitted topic.
schema_version: 1
name: jcheng-teleop
version: 0.3.0
contract:
  interfaces: ">=0.3,<0.4"
  contract_hash: "sha256:8bc92d18a503ec54db443596eec232b5117f4c6d510f7493d4e107b93a5d3358"
  system_api: ">=0.1,<0.2"
safety:
  class: offline
  scopes: []
  # Required by capability-manifest.v1.schema.json.
  requires_lease: true
  max_rate_hz: 50
  deadman_ms: 300
hardware_access: none
runtime:
  ros_domains: []
  publishes: []
  subscribes: []
