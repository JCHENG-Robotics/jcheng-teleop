# Capability manifest for the organization's admission check.
# jcheng-teleop is an L3 capability: operator input to teleoperation intent
# (JCHENG-Robotics/.github docs/repo-taxonomy.md, layer L3).
#
# v0.3.0 implements the M1 ROS-free core and CLI. It has no ROS node, no DDS
# domain, no input device access and publishes no intent. The empty runtime
# surface is deliberate: a planned capability must not claim a topic it does
# not serve. `TeleopCommand.msg` is reserved in jcheng-interfaces v0.1.0, but
# no system consumer exists yet. The M2 streaming path is a system-side
# prerequisite (docs/proposals/SYSTEM_TELEOP_INTAKE.md); the reserved topic
# stays unused until that path is accepted and implemented.
#
# The safety envelope below is declared even while `class: offline`; it is not
# active because the runtime surface is empty. It becomes binding in the
# contract-first M2 PR, together with the node, scopes and runtime surface.
schema_version: 1
name: jcheng-teleop
version: 0.3.0
contract:
  interfaces: ">=0.1,<0.2"
  contract_hash: "sha256:0b8d72ced7f54d444d6851d8b99a51a78e2bed3f687324f51a15f76557f24b42"
  system_api: ">=0.1,<0.2"
safety:
  class: offline
  scopes: []
  # Required by capability-manifest.v1.schema.json.
  requires_lease: true
  max_rate_hz: 50
  deadman_ms: 300
hardware_access: none
runtime:
  ros_domains: []
  publishes: []
  subscribes: []
