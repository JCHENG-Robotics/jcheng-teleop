[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jcheng-teleop"
version = "0.3.0"
description = "ROS-free teleoperation core for the JCHENG ecosystem"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
jcheng-teleop = "jcheng_teleop.cli:main"
jcheng-teleop-replay = "jcheng_teleop.replay.cli:main"
jcheng-teleop-preflight = "jcheng_teleop.supervised.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "ros2_ws/src/jcheng_teleop_ros"]
testpaths = ["tests"]
addopts = "-q"
